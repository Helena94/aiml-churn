model_name: logistic_regression

# List of param grids — GridSearchCV will search over each dict
param_grid:
  - model__C: [0.01, 0.1, 1.0, 10.0]
    model__penalty: [null, "l2"]
    model__solver: ["lbfgs"]
    model__class_weight: [null, "balanced"]

  - model__C: [0.01, 0.1, 1.0, 10.0]
    model__penalty: ["l1"]
    model__solver: ["saga"]
    model__class_weight: [null, "balanced"]

  - model__C: [0.01, 0.1, 1.0, 10.0]
    model__penalty: ["elasticnet"]
    model__solver: ["saga"]
    model__l1_ratio: [0.25, 0.5, 0.75]
    model__class_weight: [null, "balanced"]

SearchCVConfig:
  scoring: roc_auc
  n_jobs: -1
  verbose: 1

StratifiedKFoldConfig:
  n_splits: 5
  shuffle: true
  random_state: 42
