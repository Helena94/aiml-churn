model_name: xgboost

param_distributions:
  model__max_iter: [ 200, 500, 800 ]
  model__max_depth: [ 3, 5, 7, null ]
  model__learning_rate: [ 0.01, 0.05, 0.1 ]
  model__min_samples_leaf: [ 10, 20, 30 ]
  model__l2_regularization: [ 0.0, 0.1, 1.0 ]

SearchCVConfig:
  scoring: roc_auc
  n_iter: 25
  n_jobs: -1
  random_state: 42
  verbose: 1

StratifiedKFoldConfig:
  n_splits: 5
  shuffle: true
  random_state: 42
