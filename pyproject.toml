[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Telco customer churn prediction"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=1.7.4.5",
    "pandas>=2.3.3",
    "squarify>=0.4.4",
    "sweetviz>=2.3.1",
    "ydata-profiling>=4.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]
