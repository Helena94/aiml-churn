[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Telco customer churn prediction"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.78.0",
    "kaggle>=1.6,<1.7",
    "mlflow>=3.9.0",
    "pandas>=2.3.3",
    "prefect>=3.6.13",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "squarify>=0.4.4",
    "sweetviz>=2.3.1",
    "xgboost>=3.1.3",
    "ydata-profiling>=4.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
log_cli = false
